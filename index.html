<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP Play OAuth</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #f0f0e6; }
    main { width: min(520px, calc(100% - 40px)); border: 1px solid #8a2de3; background: #09090b; }
    header { padding: 16px; border-bottom: 1px solid #8a2de3; color: #b6ff00; font-weight: 800; letter-spacing: .1em; }
    p { margin: 0; padding: 20px 16px; color: #9e9e99; font-size: 13px; line-height: 1.6; }
    a { color: #b6ff00; }
  </style>
</head>
<body>
  <main>
    <header>TP PLAY // OAUTH</header>
    <p>AT Protocol client metadata is available at <a href="oauth-client-metadata.json">oauth-client-metadata.json</a>.</p>
  </main>

</html>
